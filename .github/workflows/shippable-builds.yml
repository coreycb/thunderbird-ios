name: Shippable Builds

env:
  IOS_RUNTIME: "iOS 26"
  XCODE_VERSION: "26.0"
  # DEFAULT_VERSION is used when no version is provided via workflow_dispatch.
  # Scheduled builds stamp the app with this version.
  DEFAULT_VERSION: &default_version "1.0"
  DEFAULT_NOTIFY_TESTERS: &default_notify_testers false
  DEFAULT_TEST_DEVICE: &default_test_device "iPhone 17 Pro"

on:
  schedule:
    # Weekly run on Friday at 14:00 UTC
    - cron: '0 14 * * 5'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (optional)'
        required: false
        default: *default_version
        type: string
      notify_testers:
        description: 'Notify external testers'
        required: false
        default: *default_notify_testers
        type: boolean
      test_device:
        description: 'iOS Simulator device for tests (optional)'
        required: false
        default: *default_test_device
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_and_deploy_ios:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Xcode Select Version
        uses: mobiledevops/xcode-select-version-action@a58204ef24b6e61857940e51c0e11b0368065b94 # v1.0.0
        with:
          xcode-select-version: ${{ env.XCODE_VERSION }}

      - name: Ensure iOS 26 Simulator Runtime installed
        run: xcodebuild -downloadPlatform iOS

      - name: Setup Ruby and Fastlane
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1.295.0
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: fastlane

      - name: Resolve Package Dependencies
        working-directory: fastlane
        run: |
          xcodebuild -resolvePackageDependencies -workspace ../Thunderbird.xcworkspace -scheme Thunderbird

      - name: Build and Deploy to TestFlight
        working-directory: fastlane
        env:
          VERSION_INPUT: ${{ inputs.version || env.DEFAULT_VERSION }}
          TEST_DEVICE: ${{ inputs.test_device || env.DEFAULT_TEST_DEVICE }}
        run: |
          bundle exec fastlane beta
